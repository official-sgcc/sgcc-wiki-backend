name: Backend CI

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv==0.12.17
          uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Run tests
        run: .venv/bin/python -m pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up production Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv and locked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.17
          python_path="$(python -c 'import sys; print(sys.executable)')"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/backend-package-venv" \
            uv sync --locked --no-dev --no-install-project --python "$python_path"

      - name: Build and validate wheel
        shell: bash
        env:
          DB_PATH: ${{ runner.temp }}/backend-package.db
          EMAIL_PROVIDER: log
          JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-bytes
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/backend-package-venv"
          dist="$RUNNER_TEMP/backend-dist"

          uv build --wheel --out-dir "$dist"
          shopt -s nullglob
          wheels=("$dist"/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one backend wheel, found ${#wheels[@]}." >&2
            exit 1
          fi

          uv pip install --python "$runtime/bin/python" --no-deps "${wheels[0]}"
          uv pip check --python "$runtime/bin/python"
          cd "$RUNNER_TEMP"
          "$runtime/bin/python" -c \
            'from sgcc_wiki_backend import app; schema = app.openapi(); assert schema["info"]["title"] == "SGCC Wiki API"; assert "/healthz" in schema["paths"]'

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
