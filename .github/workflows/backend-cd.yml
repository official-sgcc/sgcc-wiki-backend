name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/sgcc-wiki-backend

            if git ls-files --error-unmatch .env >/dev/null 2>&1; then
              echo "Refusing to deploy: .env is tracked."
              exit 1
            fi
            git fetch origin main
            if git ls-tree -r --name-only origin/main -- .env | grep -q .; then
              echo "Refusing to deploy: origin/main contains .env."
              exit 1
            fi
            deploy_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
            if [ "$(git rev-parse origin/main)" != "$deploy_sha" ]; then
              echo "A newer main commit exists; skipping this deployment."
              exit 0
            fi
            git reset --hard "$deploy_sha"

            bash scripts/deploy-ec2.sh

            echo "Backend deployment completed successfully."
